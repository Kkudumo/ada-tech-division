<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ADA Tech Publisher | Private Admin</title><link rel="stylesheet" href="/styles.css"><style>.adminShell{min-height:100vh;background:#f4f6f8;padding:38px 0 70px}.adminTop{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.adminTop h1{font-size:clamp(42px,6vw,70px);letter-spacing:-.055em;line-height:.95;margin:.15em 0}.adminTabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}.adminTabs button{border:1px solid #d5dde5;background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:800}.adminTabs button.active{background:#08131d;color:#fff}.hidden{display:none!important}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.list{display:grid;gap:10px}.rowCard{background:#fff;border:1px solid #dfe5eb;border-radius:16px;padding:16px}.rowCard header{display:flex;justify-content:space-between;gap:16px}.rowActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.rowActions button{border:0;border-radius:999px;padding:9px 12px;cursor:pointer}.rowActions .primary{background:#005ce0;color:#fff}.rowActions .dark{background:#08131d;color:#fff}.pill{font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #d8e0e8;padding:5px 8px;border-radius:99px}.login{max-width:520px}@media(max-width:900px){.adminGrid{grid-template-columns:1fr}.adminTop{align-items:flex-start;flex-direction:column}}</style></head><body><main class="adminShell"><div class="wrap"><div class="adminTop"><div><span class="eyebrow">Private ADA Tech console</span><h1>Tech Publisher</h1><p>Publish real Case Files, moderate reviews and manage client support tickets.</p></div><a class="btn white" href="/work">View public Case Files</a></div><section id="loginBox" class="support-form login"><h2>Admin sign in</h2><div class="form-field"><label>Email</label><input id="adminEmail" type="email" autocomplete="username"></div><div class="form-field"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn dark full">Sign in</button><div id="loginMsg" class="form-message"></div></section><section id="console" class="hidden"><div class="adminTabs"><button data-tab="cases" class="active">Case Files</button><button data-tab="reviews">Reviews</button><button data-tab="tickets">Client Tickets</button><button id="logoutBtn">Sign out</button></div><div id="casesTab"><div class="adminGrid"><form id="caseForm" class="support-form"><h2>Publish a real job</h2><div class="form-field"><label>Title</label><input name="title" required></div><div class="form-grid"><div class="form-field"><label>Category</label><select name="category"><option>Computer/Laptop</option><option>Hardware Diagnostics</option><option>Windows/Software</option><option>Networking/Wi-Fi</option><option>CCTV</option><option>Business IT</option><option>Infrastructure</option><option>Other</option></select></div><div class="form-field"><label>Completed date</label><input type="date" name="completed_on"></div></div><div class="form-grid"><div class="form-field"><label>Device / system</label><input name="device_system"></div><div class="form-field"><label>Location</label><input name="location" value="Rundu, Namibia"></div></div><div class="form-field"><label>Client display name (optional)</label><input name="client_display_name" placeholder="Leave blank for privacy"></div><div class="form-field"><label>Reported issue</label><textarea name="reported_issue" required></textarea></div><div class="form-field"><label>Diagnosis</label><textarea name="diagnosis" required></textarea></div><div class="form-field"><label>Intervention</label><textarea name="intervention" required></textarea></div><div class="form-field"><label>Result</label><textarea name="result" required></textarea></div><div class="form-field"><label>Recommendation</label><textarea name="recommendation"></textarea></div><div class="form-field"><label>Cover photo</label><input type="file" name="cover" accept="image/*"></div><label><input type="checkbox" name="featured"> Featured</label><br><label><input type="checkbox" name="published" checked> Publish immediately</label><div id="caseMsg" class="form-message"></div><button class="btn blue full" type="submit">Publish Case File →</button></form><div><div class="section-heading" style="margin-bottom:18px"><div><span class="eyebrow">Recent work</span><h2 style="font-size:36px">Case Files</h2></div></div><div id="caseAdminList" class="list"></div></div></div></div><div id="reviewsTab" class="hidden"><div id="reviewAdminList" class="list"></div></div><div id="ticketsTab" class="hidden"><div id="ticketAdminList" class="list"></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vjbdosprwtelfbpqpdcc.supabase.co','sb_publishable_th-M8QaGo0TWx52Ce3yF1w_2X9FK37U'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function refreshSession(){const {data}=await db.auth.getSession(),on=!!data.session;loginBox.classList.toggle('hidden',on);console.classList.toggle('hidden',!on);if(on)loadAll()}refreshSession();loginBtn.onclick=async()=>{loginMsg.style.display='block';loginMsg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:adminEmail.value,password:adminPassword.value});loginMsg.textContent=error?error.message:'Signed in';if(!error)refreshSession()};logoutBtn.onclick=async()=>{await db.auth.signOut();refreshSession()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['cases','reviews','tickets'].forEach(t=>document.getElementById(t+'Tab').classList.toggle('hidden',t!==b.dataset.tab))});async function upload(file){if(!file||!file.size)return null;const path=Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'-');const {error}=await db.storage.from('tech-case-files').upload(path,file);if(error)throw error;return db.storage.from('tech-case-files').getPublicUrl(path).data.publicUrl}caseForm.addEventListener('submit',async e=>{e.preventDefault();caseMsg.style.display='block';caseMsg.textContent='Publishing…';try{const f=new FormData(e.target),cover=await upload(f.get('cover')),title=f.get('title'),slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36),{data:{user}}=await db.auth.getUser(),payload={slug,title,category:f.get('category'),client_display_name:f.get('client_display_name')||null,device_system:f.get('device_system')||null,location:f.get('location')||'Rundu, Namibia',reported_issue:f.get('reported_issue'),diagnosis:f.get('diagnosis'),intervention:f.get('intervention'),result:f.get('result'),recommendation:f.get('recommendation')||null,cover_image_url:cover,completed_on:f.get('completed_on')||new Date().toISOString().slice(0,10),featured:!!f.get('featured'),published:!!f.get('published'),created_by:user.id};const {error}=await db.from('tech_case_files').insert(payload);if(error)throw error;caseMsg.textContent='Case File published.';e.target.reset();loadCases()}catch(err){caseMsg.textContent=err.message}});async function loadCases(){const {data,error}=await db.from('tech_case_files').select('*').order('created_at',{ascending:false}).limit(30);if(error){caseAdminList.innerHTML='<p>'+esc(error.message)+'</p>';return}caseAdminList.innerHTML=(data||[]).map(c=>`<article class="rowCard"><header><div><b>${esc(c.title)}</b><p>${esc(c.category)} · ${c.published?'Published':'Draft'}</p></div><span class="pill">${c.published?'Live':'Draft'}</span></header><p>${esc(c.result)}</p><div class="rowActions"><button class="primary caseToggle" data-id="${c.id}" data-pub="${!c.published}">${c.published?'Unpublish':'Publish'}</button></div></article>`).join('')||'<p>No Case Files yet.</p>'}async function loadReviews(){const {data,error}=await db.from('tech_reviews').select('*').order('created_at',{ascending:false}).limit(50);if(error){reviewAdminList.innerHTML='<p>'+esc(error.message)+'</p>';return}reviewAdminList.innerHTML=(data||[]).map(r=>`<article class="rowCard"><header><div><b>${esc(r.client_name)} — ${r.rating}/5</b><p>${esc(r.review)}</p></div><span class="pill">${r.approved?'Published':'Pending'}</span></header><div class="rowActions"><button class="primary reviewApprove" data-id="${r.id}">Approve + verify</button><button class="reviewHide" data-id="${r.id}">Hide</button></div></article>`).join('')||'<p>No reviews yet.</p>'}async function loadTickets(){const {data,error}=await db.from('tech_tickets').select('*').order('created_at',{ascending:false}).limit(50);if(error){ticketAdminList.innerHTML='<p>'+esc(error.message)+'</p>';return}ticketAdminList.innerHTML=(data||[]).map(t=>`<article class="rowCard"><header><div><b>${esc(t.ticket_code)} · ${esc(t.subject)}</b><p>${esc(t.client_name)} · ${esc(t.ticket_type)} · ${esc(t.priority_level)}</p></div><span class="pill">${esc(t.status)}</span></header><p>${esc(t.description)}</p><div class="rowActions"><button class="primary ticketAction" data-id="${t.id}" data-status="reviewing">Reviewing</button><button class="ticketAction" data-id="${t.id}" data-status="in_progress">In progress</button><button class="dark ticketAction" data-id="${t.id}" data-status="resolved">Resolve</button></div></article>`).join('')||'<p>No tickets yet.</p>'}async function ticketUpdate(id,status){const message=prompt('Client-visible update message:');if(!message)return;await db.from('tech_tickets').update({status,updated_at:new Date().toISOString(),resolved_at:status==='resolved'?new Date().toISOString():null}).eq('id',id);await db.from('tech_ticket_updates').insert({ticket_id:id,status,message,public_to_client:true});loadTickets()}document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('caseToggle')){await db.from('tech_case_files').update({published:b.dataset.pub==='true'}).eq('id',b.dataset.id);loadCases()}if(b.classList.contains('reviewApprove')){await db.from('tech_reviews').update({approved:true,verified:true,approved_at:new Date().toISOString()}).eq('id',b.dataset.id);loadReviews()}if(b.classList.contains('reviewHide')){await db.from('tech_reviews').update({approved:false}).eq('id',b.dataset.id);loadReviews()}if(b.classList.contains('ticketAction'))ticketUpdate(b.dataset.id,b.dataset.status)});function loadAll(){loadCases();loadReviews();loadTickets()}</script></body></html>
